name: "Setup SFDX + Auth (Client Credentials)"
description: "Installs Node deps, Salesforce CLI, sfdx-git-delta, and authenticates to the target org via the OAuth 2.0 Client Credentials flow."

inputs:
  client-id:
    description: "External Client App / Connected App Consumer Key (client_id)"
    required: true
  client-secret:
    description: "External Client App / Connected App Consumer Secret (client_secret)"
    required: true
  instance-url:
    description: "Org My Domain URL, e.g. https://mydomain.my.salesforce.com (NOT login/test.salesforce.com)"
    required: true
  alias:
    description: "Alias to assign to the authenticated org"
    required: false
    default: "targetOrg"

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    - name: Install Salesforce CLI + sfdx-git-delta
      shell: bash
      run: |
        npm install --global @salesforce/cli@latest
        echo "y" | sf plugins install sfdx-git-delta
        sf version --verbose --json

    - name: Authenticate via Client Credentials
      shell: bash
      env:
        CC_CLIENT_ID: ${{ inputs.client-id }}
        CC_CLIENT_SECRET: ${{ inputs.client-secret }}
        CC_INSTANCE_URL: ${{ inputs.instance-url }}
        CC_ALIAS: ${{ inputs.alias }}
      run: |
        set -euo pipefail
        BASE="${CC_INSTANCE_URL%/}"
        echo "Requesting access token from ${BASE}/services/oauth2/token ..."
        RESP="$(curl -s -S -X POST "${BASE}/services/oauth2/token" \
          --data-urlencode "grant_type=client_credentials" \
          --data-urlencode "client_id=${CC_CLIENT_ID}" \
          --data-urlencode "client_secret=${CC_CLIENT_SECRET}")"

        ACCESS_TOKEN="$(echo "$RESP" | jq -r '.access_token // empty')"
        RESP_INSTANCE="$(echo "$RESP" | jq -r '.instance_url // empty')"

        if [ -z "$ACCESS_TOKEN" ]; then
          echo "::error::Client Credentials authentication failed."
          echo "$RESP" | jq -r 'if .error then "error=\(.error) description=\(.error_description)" else . end' || echo "$RESP"
          exit 1
        fi

        : "${RESP_INSTANCE:=$BASE}"
        echo "Authenticated. Instance: ${RESP_INSTANCE}"

        # sf org login access-token reads the token from SF_ACCESS_TOKEN.
        export SF_ACCESS_TOKEN="$ACCESS_TOKEN"
        sf org login access-token \
          --instance-url "$RESP_INSTANCE" \
          --alias "$CC_ALIAS" \
          --set-default \
          --no-prompt

        sf org display --target-org "$CC_ALIAS"
